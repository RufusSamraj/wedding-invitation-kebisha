<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#f7f3eb"/><title>Thank you — Grace & Daniel</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/><link rel="stylesheet" href="styles.css"/></head><body><main class="success-page"><div class="success-card"><div class="closing-flower">❀</div><p class="eyebrow">Your reply is with us</p><h1>Thank <em>you</em></h1><p>We’re so grateful you took a moment to reply. We can’t wait to celebrate together.</p><a class="button button-gold" href="/">Return to the invitation <span>→</span></a><p class="success-signoff">With love, Grace & Daniel</p></div></main><style>.success-page{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 40%,#fffdf8,#f2ede3)}.success-card{max-width:560px;text-align:center;padding:65px 32px;background:#fffdf8;border:1px solid #e6dfd1}.success-card h1{font:400 clamp(3.8rem,10vw,6rem)/1 var(--serif);margin:0 0 18px}.success-card h1 em{color:var(--gold-dark);font-weight:400}.success-card>p:not(.eyebrow):not(.success-signoff){font-size:.8rem;line-height:1.8;color:var(--muted);max-width:370px;margin:0 auto 26px}.success-signoff{font:italic 1.35rem var(--serif);color:var(--sage);margin:25px 0 0}</style></body></html>
